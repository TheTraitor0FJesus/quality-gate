[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-gate"
version = "2.0.4"
description = "One quality contract for local Git hooks and GitHub CI."
requires-python = ">=3.11"

[project.optional-dependencies]
tools = [
    "deptry==0.25.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]
test = ["deptry==0.25.1", "pytest==9.1.1"]

[tool.deptry]
optional_dependencies_dev_groups = ["test", "tools"]

[project.scripts]
quality-gate = "quality_gate.cli:main"

[tool.setuptools]
packages = ["quality_gate"]

[tool.setuptools.package-data]
quality_gate = ["policy/*.ini", "policy/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "quality_gate/policy/ruff.toml"

[tool.mypy]
files = ["quality_gate", "tests"]
