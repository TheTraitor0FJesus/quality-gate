waivers = []

[quality]
schema = 2
policy_release = "v2.0.4"

[repository]
name = "REVIEW_REQUIRED"
domains = ["repository"]
required_documents = ["AGENTS.md"]

[repository.limits]
max_blob_size_mib = 5

[repository.defaults]
command_timeout_seconds = 120
test_timeout_seconds = 300
gate_timeout_seconds = 600

# Add one [[python]] table for each Python component when needed.
# Paths describe component layout; they do not override shared quality rules.
# The consumer's GitHub workflow must call the reusable workflow at a full commit SHA.
# Its optional python-version input may override the versions declared by the components.

# Add one [[web]] table for each project-owned JavaScript/CSS asset boundary when needed.
# Asset patterns and exclusions are relative to root. Limits are KiB and default to the values below.
# [[web]]
# name = "frontend"
# root = "static"
# javascript = ["js/**/*.js"]
# css = ["css/**/*.css"]
# exclude = ["vendor/**", "generated/**"]
#
# [web.limits]
# javascript_file_kib = 100
# css_file_kib = 50
# javascript_total_kib = 250
# css_total_kib = 100
# Biome lint and formatting use the release-pinned standalone binary and policy.
