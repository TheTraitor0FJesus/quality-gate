name: Quality Gate release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Already owner-merged PR whose original candidate should be recovered."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

# Distinct runs retain preparation/build evidence. The shared publisher serializes writes.
concurrency:
  group: quality-gate-release-run-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/release-prepare.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}

  build-and-verify:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.status == 'build-required'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact merged product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Download the retained original candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate-id }}
          run-id: ${{ needs.prepare.outputs.candidate-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true

      - name: Set up the supported Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify package
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_PATH: ${{ runner.temp }}/release-candidate/candidate.json
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate-digest }}
          PUBLISHER_SHA: ${{ needs.prepare.outputs.provider-sha }}
        run: python scripts/release_build.py

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: release-evidence-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-gate-release/${{ matrix.platform }}/*.zip
            ${{ runner.temp }}/quality-gate-release/${{ matrix.platform }}/evidence.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish:
    name: Publish release
    needs: [prepare, build-and-verify]
    if: needs.prepare.outputs.status == 'build-required'
    uses: ./.github/workflows/release-publish.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      candidate-id: ${{ needs.prepare.outputs.candidate-id }}
    secrets:
      publication-token: ${{ secrets.RELEASE_TOKEN }}
