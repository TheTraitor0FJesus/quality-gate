name: Quality Gate release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Already owner-merged PR whose original candidate should be recovered."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

# Distinct runs retain preparation/build evidence. The shared publisher serializes writes.
concurrency:
  group: quality-gate-release-run-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/release-prepare.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}

  build-and-verify:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.status == 'build-required'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact merged product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Download the retained original candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate-id }}
          run-id: ${{ needs.prepare.outputs.candidate-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true

      - name: Set up the supported Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify package
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_PATH: ${{ runner.temp }}/release-candidate/candidate.json
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate-digest }}
          PUBLISHER_SHA: ${{ needs.prepare.outputs.provider-sha }}
        run: python scripts/release_build.py

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: release-evidence-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-gate-release/${{ matrix.platform }}/*.zip
            ${{ runner.temp }}/quality-gate-release/${{ matrix.platform }}/evidence.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish:
    name: Publish release
    needs: [prepare, build-and-verify]
    if: needs.prepare.outputs.status == 'build-required'
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: read
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      candidate-id: ${{ needs.prepare.outputs.candidate-id }}

  dispatch-rollout:
    name: Dispatch verified release rollout
    needs: [prepare, publish]
    if: needs.prepare.outputs.status == 'build-required' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the executed release dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Create provider-scoped dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.QUALITY_GATE_ROLLOUT_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUALITY_GATE_ROLLOUT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: quality-gate
          permission-contents: write

      - name: Send published release event
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUALITY_GATE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          QUALITY_GATE_PROVIDER_SHA: ${{ needs.prepare.outputs.provider-sha }}
        shell: bash
        run: python -B -m quality_gate.release_rollout dispatch
