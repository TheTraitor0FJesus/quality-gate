name: Dependabot release decision

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: dependabot-release-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  add-decision:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create a repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.QUALITY_GATE_ROLLOUT_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUALITY_GATE_ROLLOUT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Add the no-release decision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B -m scripts.dependabot_release
