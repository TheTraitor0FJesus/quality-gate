name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    uses: TheTraitor0FJesus/quality-gate/.github/workflows/quality.yml@<40-character-commit-sha>
