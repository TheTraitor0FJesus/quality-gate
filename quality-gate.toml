[[waivers]]
kind = "standard"
check_id = "repository.workflow"
target = ".github/workflows/parity.yml"
reason = "Parity is intentionally non-gating and runs only by dispatch or weekly schedule."
approved_by = "TheTraitor0FJesus"
reviewed_on = "2026-08-26"
expires_on = "2027-08-26"

[quality]
schema = 2
policy_release = "v2.0.4"

[repository]
name = "quality-gate"
domains = ["repository", "python"]
required_documents = [
    "AGENTS.md",
    "README.md",
    "docs/agent-reference.md",
    "docs/architecture.md",
    "docs/coding-standards.md",
    "docs/lessons.md",
    "docs/quality-policy-changes.md",
    "docs/release.md",
    "quality-gate.toml",
]

[repository.limits]
max_blob_size_mib = 5

[repository.defaults]
command_timeout_seconds = 120
test_timeout_seconds = 300
gate_timeout_seconds = 600

[[python]]
name = "quality-gate"
path = "quality_gate"
python_version = "3.12"
dependency_inputs = ["pyproject.toml"]
test_paths = ["tests"]
tests_applicable = true
timeout_seconds = 300
