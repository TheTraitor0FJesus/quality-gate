name: Release decision validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read
  packages: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release decision
    uses: ./.github/workflows/release-prepare.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
      validation-only: true
