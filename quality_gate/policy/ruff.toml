ignore = ["W191"]
unfixable = ["F401"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 50

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"**/test_*.py" = ["S101", "S105", "S106", "S107"]
"**/*_test.py" = ["S101", "S105", "S106", "S107"]

[lint.isort]
known-first-party = ["quality_gate"]

[format]
indent-style = "tab"
quote-style = "double"
skip-magic-trailing-comma = false
