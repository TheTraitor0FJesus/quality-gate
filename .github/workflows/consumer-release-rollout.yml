name: Quality Gate consumer release rollout

on:
  repository_dispatch:
    types: [quality-gate-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without the v prefix (recovery only).
        required: true
        type: string
      provider_sha:
        description: Verified full provider workflow SHA (recovery only).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-gate-consumer-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan-consumers:
    name: Read registered consumer targets
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.targets.outputs.repositories }}
    steps:
      - name: Check out Quality Gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read consumer manifest
        id: targets
        shell: bash
        run: |
          repositories="$(python -B -m quality_gate.consumer_rollout targets)"
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

  update-consumers:
    name: Update ${{ matrix.repository }}
    needs: plan-consumers
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.plan-consumers.outputs.repositories) }}
    concurrency:
      group: quality-gate-consumer-rollout-${{ matrix.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Quality Gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create consumer-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.QUALITY_GATE_ROLLOUT_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUALITY_GATE_ROLLOUT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: quality-gate,${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create or refresh consumer rollout PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUALITY_GATE_RELEASE_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
          QUALITY_GATE_PROVIDER_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.provider_sha || inputs.provider_sha }}
          QUALITY_GATE_CONSUMER: ${{ matrix.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m quality_gate.consumer_rollout consumers --repository "$QUALITY_GATE_CONSUMER"
