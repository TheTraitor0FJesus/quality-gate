waivers = []

[quality]
schema = 2
policy_release = "v2.0.0"

[repository]
name = "quality-gate"
domains = ["repository", "python"]
required_documents = [
    "AGENTS.md",
    "README.md",
    "docs/architecture.md",
    "docs/quality-policy-changes.md",
    "quality-gate.toml",
]

[repository.limits]
max_blob_size_mib = 5

[repository.defaults]
command_timeout_seconds = 120
test_timeout_seconds = 300
gate_timeout_seconds = 600

[[python]]
name = "quality-gate"
path = "quality_gate"
python_version = "3.12"
dependency_inputs = ["pyproject.toml"]
test_paths = ["tests"]
tests_applicable = true
timeout_seconds = 300
