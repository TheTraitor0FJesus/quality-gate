name: Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used to bootstrap and prepare declared component runtimes."
        required: false
        type: string
      runner-os:
        description: "Runner label used by the repository-owned cross-platform parity harness."
        required: false
        default: "ubuntu-latest"
        type: string
      parity:
        description: "Run the release-backed cross-platform parity fixture and publish its result."
        required: false
        default: false
        type: boolean
      parity-result-name:
        description: "Stable artifact suffix used by the parity comparison workflow."
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs['runner-os'] || 'ubuntu-latest' }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality checks
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs['runner-os'] || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out the verifier from the pinned reusable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quality-gate-ci
          persist-credentials: false
          sparse-checkout: |
            quality_gate
            .github/actions/prepare

      - name: Prepare the exact policy and component environments
        id: policy_release
        uses: ./.quality-gate-ci/.github/actions/prepare
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Run the complete Quality Gate for a pull request range
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          QUALITY_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          QUALITY_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
          QUALITY_GATE_POLICY_RELEASE: ${{ steps.policy_release.outputs.release }}
          QUALITY_GATE_POLICY_BOOTSTRAP: ${{ steps.policy_release.outputs.bootstrap }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_GATE_POLICY_BOOTSTRAP" == "true" ]]; then
            python scripts/release_adapter.py bootstrap-check --policy-release "$QUALITY_GATE_POLICY_RELEASE" --base "$QUALITY_GATE_BASE" --head "$QUALITY_GATE_HEAD"
          else
            quality-gate check --base "$QUALITY_GATE_BASE" --head "$QUALITY_GATE_HEAD"
          fi

      - name: Repeat the gate and report direct default-branch pushes
        if: github.event_name == 'push'
        shell: bash
        env:
          QUALITY_GATE_POLICY_RELEASE: ${{ steps.policy_release.outputs.release }}
          QUALITY_GATE_POLICY_BOOTSTRAP: ${{ steps.policy_release.outputs.bootstrap }}
        run: |
          set -euo pipefail
          echo "::notice title=Quality Gate::Default-branch pushes are detection-only on private GitHub Free repositories; local pre-push policy and pull requests remain required."
          if [[ "$QUALITY_GATE_POLICY_BOOTSTRAP" == "true" ]]; then
            python scripts/release_adapter.py bootstrap-check --policy-release "$QUALITY_GATE_POLICY_RELEASE" --head "$GITHUB_SHA"
          else
            quality-gate check --head "$GITHUB_SHA"
          fi

      - name: Run the release-backed parity fixture
        if: inputs.parity
        run: python -m quality_gate.ci_parity --output parity-result.json

      - name: Publish the machine-readable parity result
        if: always() && inputs.parity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: quality-gate-parity-${{ inputs['parity-result-name'] || runner.os }}
          path: parity-result.json
          if-no-files-found: error

  pytest:
    name: Full pytest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ${{ inputs['runner-os'] || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - name: Check out the proposed merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the verifier from the pinned reusable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quality-gate-ci
          persist-credentials: false
          sparse-checkout: |
            quality_gate
            .github/actions/prepare

      - name: Prepare the exact policy and component environments
        id: policy_release
        uses: ./.quality-gate-ci/.github/actions/prepare
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Verify merge parents
        shell: python
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          import os
          import subprocess
          expected = [os.environ[key] for key in ('EXPECTED_MERGE', 'EXPECTED_BASE', 'EXPECTED_HEAD')]
          actual = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
          if actual != expected:
              raise SystemExit('The checkout is not the requested base/head merge candidate.')

      - name: Run independent full pytest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          POLICY_RELEASE: ${{ steps.policy_release.outputs.release }}
          POLICY_BOOTSTRAP: ${{ steps.policy_release.outputs.bootstrap }}
        run: |
          set -euo pipefail
          if [[ "$POLICY_BOOTSTRAP" == "true" ]]; then
            python -m quality_gate.pytest_ci --root . --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/pytest-evidence" --policy-release "$POLICY_RELEASE"
          else
            PYTHONPATH="$GITHUB_WORKSPACE/.quality-gate-ci" python -m quality_gate.pytest_ci --root . --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/pytest-evidence"
          fi

      - name: Recheck current PR identity
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python .quality-gate-ci/quality_gate/ci_candidate.py --repository "$GH_REPO" --number "$PR_NUMBER" --base-ref "$EXPECTED_BASE_REF" --base-sha "$EXPECTED_BASE" --head-sha "$EXPECTED_HEAD"

      - name: Publish pytest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-evidence/
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: Quality Gate
    needs: [quality-checks, pytest]
    if: always() && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ inputs['runner-os'] || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out the identity verifier at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quality-gate-ci
          persist-credentials: false
          sparse-checkout: quality_gate/ci_candidate.py
          sparse-checkout-cone-mode: false

      - name: Recheck current PR identity
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python .quality-gate-ci/quality_gate/ci_candidate.py --repository "$GH_REPO" --number "$PR_NUMBER" --base-ref "$EXPECTED_BASE_REF" --base-sha "$EXPECTED_BASE" --head-sha "$EXPECTED_HEAD"

      - name: Require complete quality and applicable test results
        shell: python
        env:
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
          TEST_RESULT: ${{ needs.pytest.result }}
          TESTS_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        run: |
          import os
          if os.environ['QUALITY_RESULT'] != 'success':
              raise SystemExit('Quality checks did not complete successfully.')
          if os.environ['TESTS_REQUIRED'] == 'true' and os.environ['TEST_RESULT'] != 'success':
              raise SystemExit('Full pytest for the current merge candidate is mandatory.')
