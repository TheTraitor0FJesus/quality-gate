name: Prepare Quality Gate
description: Prepare the immutable policy and declared runtimes for either quality checks or pytest.
inputs:
  python-version:
    description: Optional explicit runtime selection.
    required: false
    default: ""
outputs:
  release:
    description: Verified immutable policy release.
    value: ${{ steps.policy_release.outputs.release }}
  bootstrap:
    description: Whether the provider candidate owns execution.
    value: ${{ steps.policy_release.outputs.bootstrap }}
runs:
  using: composite
  steps:
    - name: Install the fixed bootstrap Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
      with:
        python-version: "3.12"

    - name: Read declared Python versions
      id: manifest_python
      shell: python
      run: |
        import os
        import re
        import tomllib

        with open("quality-gate.toml", "rb") as manifest_file:
            manifest = tomllib.load(manifest_file)
        versions = sorted({item["python_version"] for item in manifest.get("python", [])})
        invalid = [
            version
            for version in versions
            if not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version)
        ]
        if invalid:
            raise SystemExit(f"invalid Python version: {invalid[0]}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("versions<<QUALITY_GATE_VERSIONS\n")
            output.write("\n".join(versions) + "\n")
            output.write("QUALITY_GATE_VERSIONS\n")

    - name: Prepare all declared Python versions
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
      with:
        python-version: ${{ inputs['python-version'] || steps.manifest_python.outputs.versions || '3.12' }}

    - name: Prepare the provider's wheel-test build backend
      if: github.repository == 'TheTraitor0FJesus/quality-gate'
      shell: bash
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r .release/build-requirements.txt

    - name: Sync the manifest's immutable Quality Gate release
      id: policy_release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        QUALITY_GATE_RELEASE="$(python -c 'import tomllib; print(tomllib.load(open("quality-gate.toml", "rb"))["quality"]["policy_release"])')"
        export QUALITY_GATE_RELEASE
        if [[ ! "$QUALITY_GATE_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "invalid policy release: $QUALITY_GATE_RELEASE" >&2
          exit 2
        fi
        QUALITY_GATE_RELEASE_URL="https://github.com/TheTraitor0FJesus/quality-gate/releases/download/${QUALITY_GATE_RELEASE}"
        QUALITY_GATE_RELEASE_API="https://api.github.com/repos/TheTraitor0FJesus/quality-gate/releases/tags/${QUALITY_GATE_RELEASE}"
        policy_bootstrap=false
        if [[ "$GITHUB_REPOSITORY" == "TheTraitor0FJesus/quality-gate" ]]; then
          policy_bootstrap=true
        fi
        export QUALITY_GATE_ASSET_NAME="quality-gate-${QUALITY_GATE_RELEASE}-${RUNNER_OS}.zip"
        export QUALITY_GATE_RELEASE_DIR="$RUNNER_TEMP/quality-gate-release"
        export QUALITY_GATE_ARCHIVE="$RUNNER_TEMP/quality-gate-release.zip"
        export QUALITY_GATE_RELEASE_METADATA="$RUNNER_TEMP/quality-gate-release.json"
        mkdir -p "$QUALITY_GATE_RELEASE_DIR"
        api_status="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "X-GitHub-Api-Version: 2026-03-10" \
          "$QUALITY_GATE_RELEASE_API" \
          --output "$QUALITY_GATE_RELEASE_METADATA" \
          --write-out '%{http_code}')"
        if [[ "$api_status" == "404" && "$GITHUB_REPOSITORY" == "TheTraitor0FJesus/quality-gate" ]]; then
          QUALITY_GATE_RELEASE="$(python -c 'import tomllib; print(tomllib.load(open(".release/release-tools.toml", "rb"))["bootstrap"]["policy_release"])')"
          if [[ ! "$QUALITY_GATE_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid bootstrap policy release: $QUALITY_GATE_RELEASE" >&2
            exit 2
          fi
          policy_bootstrap=true
          export QUALITY_GATE_RELEASE
          QUALITY_GATE_RELEASE_URL="https://github.com/TheTraitor0FJesus/quality-gate/releases/download/${QUALITY_GATE_RELEASE}"
          QUALITY_GATE_RELEASE_API="https://api.github.com/repos/TheTraitor0FJesus/quality-gate/releases/tags/${QUALITY_GATE_RELEASE}"
          export QUALITY_GATE_ASSET_NAME="quality-gate-${QUALITY_GATE_RELEASE}-${RUNNER_OS}.zip"
          api_status="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$QUALITY_GATE_RELEASE_API" \
            --output "$QUALITY_GATE_RELEASE_METADATA" \
            --write-out '%{http_code}')"
        fi
        if [[ "$api_status" != "200" ]]; then
          echo "Quality Gate release metadata request returned HTTP $api_status" >&2
          exit 2
        fi
        curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 104857600 \
          "${QUALITY_GATE_RELEASE_URL}/${QUALITY_GATE_ASSET_NAME}" \
          --output "$QUALITY_GATE_ARCHIVE"
        QUALITY_GATE_WHEEL="$(python .quality-gate-ci/quality_gate/ci_release.py \
          --metadata "$QUALITY_GATE_RELEASE_METADATA" \
          --archive "$QUALITY_GATE_ARCHIVE" \
          --target "$QUALITY_GATE_RELEASE_DIR" \
          --release "$QUALITY_GATE_RELEASE" \
          --asset-name "$QUALITY_GATE_ASSET_NAME")"
        test -f "$QUALITY_GATE_WHEEL"
        python -m pip install --no-deps "$QUALITY_GATE_WHEEL"
        if [[ "$GITHUB_REPOSITORY" != "TheTraitor0FJesus/quality-gate" ]]; then
          python -c 'import quality_gate, sys; sys.exit(0 if int(quality_gate.__version__.split(".")[0]) >= 5 else "This workflow requires a v5 policy/workflow pair; update both consumer pins together.")'
        fi
        quality-gate sync --source "$QUALITY_GATE_RELEASE_DIR" --version "$QUALITY_GATE_RELEASE"
        echo "release=$QUALITY_GATE_RELEASE" >> "$GITHUB_OUTPUT"
        echo "bootstrap=$policy_bootstrap" >> "$GITHUB_OUTPUT"
        if [[ "$policy_bootstrap" == "true" ]]; then
          python scripts/release_adapter.py bootstrap-setup --policy-release "$QUALITY_GATE_RELEASE"
        else
          quality-gate setup
        fi
