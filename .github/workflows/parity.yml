name: Quality Gate platform parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity (${{ matrix.runner-os }})
    strategy:
      fail-fast: false
      matrix:
        runner-os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/quality.yml
    with:
      runner-os: ${{ matrix.runner-os }}
      parity: true
      parity-result-name: ${{ matrix.runner-os }}

  compare:
    name: Compare parity results
    if: always()
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the parity comparator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the parity comparator Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Download the Linux result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-gate-parity-ubuntu-latest
          path: parity/ubuntu-latest

      - name: Download the Windows result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-gate-parity-windows-latest
          path: parity/windows-latest

      - name: Compare the complete machine-readable result surface
        run: >-
          python -m quality_gate.ci_parity
          --compare parity/ubuntu-latest/parity-result.json
          parity/windows-latest/parity-result.json
