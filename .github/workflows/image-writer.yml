name: Shared verified image writer

on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: true
      candidate-id:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # ponytail: Per-repository serialization is the throughput ceiling.
  # Upgrade by sharding per GHCR package after each producer has its own verified receipt.
  group: shared-image-writing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  push-images:
    name: Push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    steps:
      - name: Check out the executed shared helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: publisher

      - name: Set up the supported Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"

      - name: Write images
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_REPOSITORY: ${{ job.workflow_repository }}
          PUBLISHER_SHA: ${{ job.workflow_sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CANDIDATE_ID: ${{ inputs.candidate-id }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -B -I publisher/scripts/source_release.py write-images --pr "$PR_NUMBER" --candidate-id "$CANDIDATE_ID" --output "$RUNNER_TEMP/image-receipt"

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: release-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-receipt/image-receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
