version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - "TheTraitor0FJesus"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    assignees:
      - "TheTraitor0FJesus"
  - package-ecosystem: pip
    directory: "/tests/fixtures/release-parity"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    assignees:
      - "TheTraitor0FJesus"
