supplemental_tests = []

[[waivers]]
kind = "standard"
check_id = "repository.workflow"
target = ".github/workflows/parity.yml"
reason = "Parity is intentionally non-gating and runs only by dispatch or weekly schedule."
approved_by = "TheTraitor0FJesus"
reviewed_on = "2026-08-26"
expires_on = "2027-08-26"

[quality]
schema = 2
policy_release = "v4.3.0"

[repository]
name = "quality-gate"
domains = ["repository", "python"]
required_documents = [
    "AGENTS.md",
    ".agents/skills/post-release-quality-gate/SKILL.md",
    ".agents/skills/post-release-quality-gate/agents/openai.yaml",
    "docs/audits/provider-v4.0.0-acceptance.md",
    "docs/audits/provider-v4.1.0-acceptance.md",
    "docs/audits/provider-v4.2.0-acceptance.md",
    ".release/release-tools.toml",
    ".release/release-requirements.txt",
    ".release/version.toml",
    ".release/notes.md",
    ".release/publisher.toml",
    ".coderabbit.yaml",
    "README.md",
    "docs/agent-reference.md",
    "docs/integrations.md",
    "docs/edit-check.md",
    "docs/edit-secrets.md",
    "docs/edit-integrity.md",
    "docs/edit-types.md",
    "docs/audits/edit-types-provider.md",
    "docs/audits/edit-secrets-provider.md",
    "docs/audits/edit-integrity-provider.md",
    "docs/audits/edit-check-provider.md",
    "docs/architecture.md",
    "docs/coding-standards.md",
    "docs/lessons.md",
    "docs/quality-policy-changes.md",
    "docs/release.md",
    "docs/publication.md",
    ".github/dependabot.yml",
    ".github/workflows/dependabot-auto-merge.yml",
    ".github/workflows/release-rollout.yml",
    ".github/workflows/release.yml",
    ".github/workflows/release-prepare.yml",
    ".github/workflows/release-publish.yml",
    ".github/workflows/image-writer.yml",
    ".github/workflows/release-validation.yml",
    "scripts/source_release.py",
    "scripts/release_adapter.py",
    "scripts/release_build.py",
    "scripts/release_metadata.py",
    "quality_gate/release_rollout.py",
    "quality-gate.toml",
]

[repository.limits]
max_blob_size_mib = 5

[repository.defaults]
command_timeout_seconds = 120
test_timeout_seconds = 1800
gate_timeout_seconds = 2400

[[python]]
name = "quality-gate"
path = "quality_gate"
python_version = "3.12"
dependency_inputs = ["pyproject.toml"]
test_paths = ["tests"]
tests_applicable = true
timeout_seconds = 300
