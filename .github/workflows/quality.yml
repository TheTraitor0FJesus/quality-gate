name: Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used to bootstrap and prepare declared component runtimes."
        required: false
        type: string
      runner-os:
        description: "Runner label used by the repository-owned cross-platform parity harness."
        required: false
        default: "ubuntu-latest"
        type: string
      parity:
        description: "Run the release-backed cross-platform parity fixture and publish its result."
        required: false
        default: false
        type: boolean
      parity-result-name:
        description: "Stable artifact suffix used by the parity comparison workflow."
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs['runner-os'] || 'ubuntu-latest' }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs['runner-os'] || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the fixed bootstrap Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Read declared Python versions
        id: manifest_python
        shell: python
        run: |
          import os
          import re
          import tomllib

          with open("quality-gate.toml", "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          versions = sorted({item["python_version"] for item in manifest.get("python", [])})
          invalid = [
              version
              for version in versions
              if not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version)
          ]
          if invalid:
              raise SystemExit(f"invalid Python version: {invalid[0]}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("versions<<QUALITY_GATE_VERSIONS\n")
              output.write("\n".join(versions) + "\n")
              output.write("QUALITY_GATE_VERSIONS\n")

      - name: Prepare all declared Python versions
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: ${{ inputs['python-version'] || steps.manifest_python.outputs.versions || '3.12' }}

      - name: Check out the verifier from the pinned reusable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quality-gate-ci
          sparse-checkout: quality_gate/ci_release.py
          sparse-checkout-cone-mode: false

      - name: Sync the manifest's immutable Quality Gate release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUALITY_GATE_RELEASE="$(python -c 'import tomllib; print(tomllib.load(open("quality-gate.toml", "rb"))["quality"]["policy_release"])')"
          export QUALITY_GATE_RELEASE
          if [[ ! "$QUALITY_GATE_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid policy release: $QUALITY_GATE_RELEASE" >&2
            exit 2
          fi
          QUALITY_GATE_RELEASE_URL="https://github.com/TheTraitor0FJesus/quality-gate/releases/download/${QUALITY_GATE_RELEASE}"
          QUALITY_GATE_RELEASE_API="https://api.github.com/repos/TheTraitor0FJesus/quality-gate/releases/tags/${QUALITY_GATE_RELEASE}"
          export QUALITY_GATE_ASSET_NAME="quality-gate-${QUALITY_GATE_RELEASE}-${RUNNER_OS}.zip"
          export QUALITY_GATE_RELEASE_DIR="$RUNNER_TEMP/quality-gate-release"
          export QUALITY_GATE_ARCHIVE="$RUNNER_TEMP/quality-gate-release.zip"
          export QUALITY_GATE_RELEASE_METADATA="$RUNNER_TEMP/quality-gate-release.json"
          mkdir -p "$QUALITY_GATE_RELEASE_DIR"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$QUALITY_GATE_RELEASE_API" \
            --output "$QUALITY_GATE_RELEASE_METADATA"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 104857600 \
            "${QUALITY_GATE_RELEASE_URL}/${QUALITY_GATE_ASSET_NAME}" \
            --output "$QUALITY_GATE_ARCHIVE"
          QUALITY_GATE_WHEEL="$(python .quality-gate-ci/quality_gate/ci_release.py \
            --metadata "$QUALITY_GATE_RELEASE_METADATA" \
            --archive "$QUALITY_GATE_ARCHIVE" \
            --target "$QUALITY_GATE_RELEASE_DIR" \
            --release "$QUALITY_GATE_RELEASE" \
            --asset-name "$QUALITY_GATE_ASSET_NAME")"
          test -f "$QUALITY_GATE_WHEEL"
          python -m pip install --no-deps "$QUALITY_GATE_WHEEL"
          quality-gate sync --source "$QUALITY_GATE_RELEASE_DIR" --version "$QUALITY_GATE_RELEASE"
          quality-gate setup

      - name: Run the complete Quality Gate for a pull request range
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          QUALITY_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          QUALITY_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          quality-gate check --base "$QUALITY_GATE_BASE" --head "$QUALITY_GATE_HEAD"

      - name: Repeat the gate and report direct default-branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=Quality Gate::Default-branch pushes are detection-only on private GitHub Free repositories; local pre-push policy and pull requests remain required."
          quality-gate check --head "$GITHUB_SHA"

      - name: Run the release-backed parity fixture
        if: inputs.parity
        run: python -m quality_gate.ci_parity --output parity-result.json

      - name: Publish the machine-readable parity result
        if: always() && inputs.parity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: quality-gate-parity-${{ inputs['parity-result-name'] || runner.os }}
          path: parity-result.json
          if-no-files-found: error
