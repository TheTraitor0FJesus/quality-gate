waivers = []

[quality]
schema = 2
policy_release = "v2.0.2"

[repository]
name = "REVIEW_REQUIRED"
domains = ["repository"]
required_documents = ["AGENTS.md"]

[repository.limits]
max_blob_size_mib = 5

[repository.defaults]
command_timeout_seconds = 120
test_timeout_seconds = 300
gate_timeout_seconds = 600

# Add one [[python]] table for each Python component when needed.
# Paths describe component layout; they do not override shared quality rules.
# The consumer's GitHub workflow must call the reusable workflow at a full commit SHA.
# Its optional python-version input may override the versions declared by the components.
